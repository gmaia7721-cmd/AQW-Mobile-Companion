name: Build and publish Android APK
on:
  push:
    branches: [ main, feature/auto-farm-boss-v1 ]
  workflow_dispatch:
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable Android signing key
        env:
          AQW_KEYSTORE_BASE64: ${{ secrets.AQW_KEYSTORE_BASE64 }}
          AQW_KEYSTORE_PASSWORD: ${{ secrets.AQW_KEYSTORE_PASSWORD }}
        run: |
          test -n "$AQW_KEYSTORE_BASE64" || (echo "::error::Configure AQW_KEYSTORE_BASE64 in repository Actions secrets" && exit 1)
          test -n "$AQW_KEYSTORE_PASSWORD" || (echo "::error::Configure AQW_KEYSTORE_PASSWORD in repository Actions secrets" && exit 1)
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$AQW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aqw-companion.jks"
          echo "AQW_KEYSTORE_PATH=$RUNNER_TEMP/aqw-companion.jks" >> "$GITHUB_ENV"
          echo "AQW_KEYSTORE_PASSWORD=$AQW_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          test -n "$VERSION_NAME"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AQW-Mobile-Companion-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/auto-farm-boss-v1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AQW Mobile Companion v${{ steps.version.outputs.version }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
